<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>registertion form</title>

    <style> 
        body {
            background-color: aqua;
        }

        input {
             text-align :center;

        }
    </style>
</head>
 

<body>
  
    <center> <h1> REGISTRATION FORM </h1>


    <table>
        <tr>
            <td> first name </td>
            <td> <input type="text" placeholder="Enter your first name"> </td> 
        </tr>
        <tr>
            <td > last name  </td> 
            <td> <input type="text" placeholder="Enter your last name"> </td>
        </tr>
        <tr>
            <td> nick name </td>
            <td> <input type="text" placeholder="Enter your nick name"> </td>
        </tr>
        <tr>
            <td> email </td>
            <td> <input type="email" placeholder="Enter your email"> </td>
        </tr>
        <tr>
            <td> password </td>
            <td> <input type="password" placeholder="Enter your password"> </td>
        </tr>
        <tr>
            <td>date of birth</td>
            <td > <input type = "date" placeholder="Enter your date of birth"> </td>
        </tr>
        <tr> 
         <td> gender </td>
         <td>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
         </td>
        </tr>
        <tr>
           <td> mobile number</td>
           <td> <input type="tel" placeholder="Enter your mobile number"> </td>
        </tr>
        <tr>
            <td> address</td>
            <td> <textarea placeholder="Enter your address"></textarea> </td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit"></td> 
            <td><input type="reset"></td>
        </tr>
    </table>
</center>
</body>

</html>
